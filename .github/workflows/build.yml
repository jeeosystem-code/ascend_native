name: Build Ascend (native)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project folder
        id: p
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            Z=$(find . -maxdepth 2 -name "*.zip" | head -1)
            if [ -n "$Z" ]; then mkdir -p _unz && unzip -q "$Z" -d _unz; S=$(find _unz -name settings.gradle.kts | head -1); fi
          fi
          if [ -z "$S" ]; then echo "settings.gradle.kts not found. Files in the repository:"; find . -maxdepth 3 -not -path './.git/*' | head -60; exit 1; fi
          D=$(dirname "$S"); echo "Project folder: $D"; echo "dir=$D" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Unit tests
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-native-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
